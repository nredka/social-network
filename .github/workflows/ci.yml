name: CI

on:
  push:
    branches: [main]
  pull_request:

# When a new run starts for the same branch or pull request, cancel the older
# one: only the latest commit matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow can read the repository and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway PostgreSQL container that lives only for this job. The
    # credentials are test-only values, so no secrets are needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_network_test
        ports:
          - 5432:5432
        # The job's steps wait until this healthcheck passes.
        options: >-
          --health-cmd "pg_isready -U test -d social_network_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The steps run directly on the runner, and the service publishes its port
      # there, so the host is localhost (in Docker Compose it will be "db").
      # app/main.py builds Settings at import time, so even pytest needs this.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/social_network_test
      # The suite refuses to run unless this database name ends with _test. The CI
      # database is throwaway, so the tests can use the same one as the migrations.
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/social_network_test
      # Throwaway value, at least 32 characters. It protects nothing: the runner is
      # discarded after the run. A real production secret would live in GitHub
      # Secrets (secrets.JWT_SECRET_KEY), never in this public file.
      JWT_SECRET_KEY: ci-only-throwaway-key-not-a-real-secret-0123456789

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is out of date instead of silently changing it.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Check migrations are reversible
        run: uv run alembic downgrade base && uv run alembic upgrade head

      # Prints the coverage report. The build fails if coverage drops below the
      # fail_under value in pyproject.toml.
      - name: Run tests with coverage
        run: uv run pytest -v --cov=app --cov-report=term-missing

  # Builds the Docker image to catch a broken Dockerfile before it is merged. It needs
  # no database, so it runs in parallel with the "test" job. Nothing is pushed.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Pinned to an exact version: "latest" could start failing the build whenever
      # hadolint adds a rule. It reads the Dockerfile from stdin.
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # load: true keeps the image in the runner's Docker so the next step can run it.
      # The layer cache lives in the GitHub Actions cache, so unchanged layers (the
      # dependency install) are reused between runs.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: social-network-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build can succeed while the container still cannot start (for example a
      # broken CMD). Run it and wait for its own healthcheck. The app needs settings
      # at startup but does not connect to the database until the first query, so
      # placeholder values are enough here.
      - name: Smoke test the image
        run: |
          docker run -d --name api-smoke \
            -e DATABASE_URL=postgresql+psycopg://user:pass@localhost:5432/db \
            -e JWT_SECRET_KEY=ci-only-throwaway-key-not-a-real-secret-0123456789 \
            social-network-api:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api-smoke)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health status: $status"
          docker logs api-smoke
          [ "$status" = "healthy" ]
          echo "runs as uid: $(docker exec api-smoke id -u)"
          [ "$(docker exec api-smoke id -u)" != "0" ]
