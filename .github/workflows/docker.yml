name: Docker

# Publishes the image to GitHub Container Registry. It runs only for main: everything
# that lands there has already passed a pull request and the required "test" check, and
# a pull request (especially one from a fork) must never get permission to publish.
# "workflow_dispatch" adds a button in the Actions tab for a manual run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes must not publish at the same time. Unlike in CI, a run that is already
# publishing is NOT cancelled: stopping a push halfway could leave a half-uploaded
# image. The next run waits for its turn instead.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read the code and write packages, nothing else.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # The arm64 half of the build runs under emulation (QEMU) and is slow.
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # QEMU lets this amd64 runner build the arm64 image; Buildx drives the build and
      # can produce one image for several platforms. Actions are pinned to a major
      # version for readability; pinning to a full commit SHA is the stricter choice
      # against a tag being moved to malicious code.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is created for this run and expires with it; its rights are the
      # "permissions" above. No personal access token is stored anywhere.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name, the tags and the labels.
      #   images: ghcr.io/<owner>/<repo> (the action lowercases it, as the registry
      #           requires)
      #   sha-<short commit>: immutable, says exactly which code is inside; this is what
      #           production should deploy
      #   latest: only for the default branch; convenient for trying it out
      #   flavor latest=false: do not add "latest" automatically on top of the above
      #   the source label links the package to this repository on GitHub
      - name: Work out the image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # One tag, two architectures: a Mac (arm64) and most servers (amd64) both pull the
      # same name and Docker picks the matching image. The layer cache lives in the
      # GitHub Actions cache. It has its own scope so it does not overwrite the cache of
      # the build check in ci.yml.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
